<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Luxury Tree Final v6 (Twinkle & Density)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; font-family: 'Times New Roman', serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI Overlay */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
        }
        
        /* Title Position */
        h1 {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #fceea7; font-size: 56px; margin: 0; font-weight: 400; 
            letter-spacing: 6px; 
            text-shadow: 0 0 50px rgba(252, 238, 167, 0.6); 
            background: linear-gradient(to bottom, #fff, #eebb66);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-family: 'Cinzel', 'Times New Roman', serif;
            opacity: 0.9;
            transition: opacity 0.5s ease;
            pointer-events: auto;
        }

        /* Controls Bottom Right */
        #controls-bottom-right {
            position: absolute;
            bottom: 40px;
            right: 40px;
            z-index: 10;
            pointer-events: auto;
            text-align: right;
        }

        .ui-hidden { opacity: 0; pointer-events: none !important; }

        /* Loading */
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease-out;
        }
        .loader-text {
            color: #d4af37; font-size: 14px; letter-spacing: 4px; margin-top: 20px;
            text-transform: uppercase; font-weight: 100;
        }
        .spinner {
            width: 40px; height: 40px; border: 1px solid rgba(212, 175, 55, 0.2); 
            border-top: 1px solid #d4af37; border-radius: 50%; 
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Upload Button */
        .upload-wrapper { margin-top: 0; pointer-events: auto; text-align: right; transition: opacity 0.5s ease; }
        .upload-btn {
            background: rgba(20, 20, 20, 0.6); 
            border: 1px solid rgba(212, 175, 55, 0.4); 
            color: #d4af37; 
            padding: 10px 25px; 
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            font-size: 10px;
            transition: all 0.4s;
            display: inline-block;
            backdrop-filter: blur(5px);
        }
        .upload-btn:hover { 
            background: #d4af37; color: #000; box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        .hint-text {
            color: rgba(212, 175, 55, 0.5); font-size: 9px; margin-top: 8px; letter-spacing: 1px; text-transform: uppercase;
        }
        #file-input { display: none; }

        /* 亮度调节滑块样式 */
        .brightness-control {
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }
        .brightness-label {
            color: #d4af37;
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .brightness-slider {
            width: 120px;
            height: 3px;
            background: rgba(212, 175, 55, 0.2);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        .brightness-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #d4af37;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.8);
        }

        /* Webcam feedback */
        #webcam-wrapper {
            position: absolute; bottom: 40px; left: 40px;
            width: 120px; height: 90px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden; opacity: 0; 
            pointer-events: none;
            transition: opacity 0.5s;
        }
    </style>
    
    <style> @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap'); </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
            }
        }
    </script>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Loading Holiday Magic</div>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <h1>Merry Christmas</h1>
    </div>
    
    <div id="controls-bottom-right">
        <div class="upload-wrapper">
            <label class="upload-btn">
                上传照片
                <input type="file" id="file-input" multiple accept="image/*">
            </label>
            <div class="hint-text">Press 'H' to Hide Controls</div>
            <!-- 亮度调节滑块 -->
            <div class="brightness-control">
                <span class="brightness-label">Photo Brightness</span>
                <input type="range" min="0.5" max="1.5" step="0.1" value="1.0" class="brightness-slider" id="brightness-slider">
            </div>
        </div>
    </div>
    <div id="webcam-wrapper">
        <video id="webcam" autoplay playsinline style="display:none;"></video>
        <canvas id="webcam-preview"></canvas>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'; 
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

        // --- CONFIGURATION ---
        const CONFIG = {
            colors: {
                bg: 0x000000, 
                champagneGold: 0xffd966, 
                deepGreen: 0x03180a,      
                accentRed: 0x990000,      
                frameGoldDark: 0xb8860b,  // 相框深金色（十六进制数值）
                frameGoldLight: 0xfff8dc  // 相框浅金色（米白金色）
            },
            particles: {
                count: 1600,       // 稍微增加数量
                dustCount: 2500, 
                treeHeight: 26,    // 稍微增高
                treeRadius: 9.5    // 稍微加宽
            },
            camera: { z: 50 },
            photo: {
                brightness: 1.0, // 照片亮度参数（1.0为正常亮度，<1.0变暗，>1.0变亮）
                opacity: 1.0,    // 照片透明度参数
                frame: {
                    thickness: 0.15,  // 相框厚度（原0.05）
                    outerBorder: 0.08, // 外边框宽度
                    innerBorder: 0.03  // 内边框宽度
                }
            }
        };

        const STATE = {
            mode: 'TREE', 
            focusIndex: -1, 
            focusTarget: null,
            hand: { detected: false, x: 0, y: 0 },
            rotation: { x: 0, y: 0 } 
        };

        let scene, camera, renderer, composer;
        let mainGroup, starMesh; 
        let clock = new THREE.Clock();
        let particleSystem = []; 
        let photoMeshGroup = new THREE.Group();
        let dustParticles; 
        let handLandmarker, video, webcamCanvas, webcamCtx;
        let caneTexture; 
        let brightnessSlider; // 亮度滑块元素
        let frameGradientTexture; // 相框渐变纹理

        // 新增：将 THREE.js 颜色值转换为 CSS 十六进制颜色字符串
        function hexToCssColor(hex) {
            return '#' + hex.toString(16).padStart(6, '0');
        }

        async function init() {
            initThree();
            setupEnvironment(); 
            setupLights();
            createTextures();
            createFrameGradientTexture(); // 创建相框渐变纹理
            createParticles(); 
            createDust();      
            createDefaultPhotos();
            setupPostProcessing();
            setupEvents();
            initBrightnessControl(); // 初始化亮度控制
            await initMediaPipe();
            
            const loader = document.getElementById('loader');
            loader.style.opacity = 0;
            setTimeout(() => loader.remove(), 800);

            animate();
        }

        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.colors.bg);
            scene.fog = new THREE.FogExp2(CONFIG.colors.bg, 0.015); // 稍微加重雾气增加景深

            camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, CONFIG.camera.z); 

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ReinhardToneMapping; 
            renderer.toneMappingExposure = 2.5; 
            container.appendChild(renderer.domElement);

            mainGroup = new THREE.Group();
            scene.add(mainGroup);
        }

        function setupEnvironment() {
            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
        }

        function setupLights() {
            const ambient = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambient);

            // 内部发光，照亮树心
            const innerLight = new THREE.PointLight(0xffaa00, 3, 25);
            innerLight.position.set(0, 5, 0);
            mainGroup.add(innerLight);

            // 主光源 - 金色
            const spotGold = new THREE.SpotLight(0xffcc66, 1500);
            spotGold.position.set(30, 40, 40);
            spotGold.angle = 0.5;
            spotGold.penumbra = 0.5;
            spotGold.castShadow = true;
            scene.add(spotGold);

            // 辅光源 - 冷色，增加立体感
            const spotBlue = new THREE.SpotLight(0x6688ff, 800);
            spotBlue.position.set(-30, 20, -30);
            scene.add(spotBlue);
        }

        function setupPostProcessing() {
            const renderScene = new RenderPass(scene, camera);
            // 调整 Bloom 参数，让高光更闪烁
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0.2; // 降低阈值，让更多东西发光
            bloomPass.strength = 1.0;  // 增强强度
            bloomPass.radius = 0.5;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);
        }

        function createTextures() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0,0,128,128);
            ctx.fillStyle = '#880000'; 
            ctx.beginPath();
            for(let i=-128; i<256; i+=32) {
                ctx.moveTo(i, 0); ctx.lineTo(i+32, 128); ctx.lineTo(i+16, 128); ctx.lineTo(i-16, 0);
            }
            ctx.fill();
            caneTexture = new THREE.CanvasTexture(canvas);
            caneTexture.wrapS = THREE.RepeatWrapping;
            caneTexture.wrapT = THREE.RepeatWrapping;
            caneTexture.repeat.set(3, 3);
        }

        // 修复：创建相框渐变纹理（模拟金属光泽）- 转换颜色格式
        function createFrameGradientTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            // 创建线性渐变（从深金到浅金）
            const gradient = ctx.createLinearGradient(0, 0, 256, 0);
            gradient.addColorStop(0, '#8B4513');    // 红棕色（边框阴影）
            // 使用转换函数将 THREE 颜色值转为 CSS 颜色
            gradient.addColorStop(0.2, hexToCssColor(CONFIG.colors.frameGoldDark)); // 深金色
            gradient.addColorStop(0.5, hexToCssColor(CONFIG.colors.frameGoldLight)); // 浅金色
            gradient.addColorStop(0.8, hexToCssColor(CONFIG.colors.frameGoldDark)); // 深金色
            gradient.addColorStop(1.0, '#8B4513');  // 红棕色（边框阴影）

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 256, 64);

            frameGradientTexture = new THREE.CanvasTexture(canvas);
            frameGradientTexture.wrapS = THREE.RepeatWrapping;
            frameGradientTexture.wrapT = THREE.ClampToEdgeWrapping;
        }

        class Particle {
            constructor(mesh, type) { 
                this.mesh = mesh;
                this.type = type;
                
                this.posTree = new THREE.Vector3();
                this.posScatter = new THREE.Vector3();
                this.baseScale = mesh.scale.x; 

                // 闪烁参数
                this.flashPhase = Math.random() * Math.PI * 2; // 随机相位
                this.flashSpeed = 2.0 + Math.random() * 3.0;   // 随机速度
                
                this.heartParamT = Math.random() * Math.PI * 2; 

                // 旋转速度
                const speedMult = (type === 'PHOTO') ? 0.3 : 2.0;
                this.spinSpeed = new THREE.Vector3(
                    (Math.random() - 0.5) * speedMult,
                    (Math.random() - 0.5) * speedMult,
                    (Math.random() - 0.5) * speedMult
                );

                this.calculatePositions();
            }

            calculatePositions() {
                // --- TREE MODE: 优化密度算法 ---
                const h = CONFIG.particles.treeHeight;
                const halfH = h / 2;
                
                // 【核心修改】密度控制
                // Math.pow(t, 1.8) 会让数值更倾向于 0 (底部)，而不是 1 (顶部)
                let t = Math.random(); 
                t = Math.pow(t, 1.8); // 1.8 次方，增加底部权重
                
                // 计算 Y 轴
                const y = (t * h) - halfH;

                // 计算半径 - 底部最宽，顶部最窄
                let rMax = CONFIG.particles.treeRadius * (1.0 - t); 
                if (rMax < 0.5) rMax = 0.5;

                // 角度 - 增加随机性防止条纹
                const angle = t * 60 * Math.PI + (Math.random() * Math.PI * 2); 
                
                // 半径分布 - 内部也有粒子，不只是表面
                const r = rMax * (0.3 + Math.random() * 0.7); 
                
                this.posTree.set(Math.cos(angle) * r, y, Math.sin(angle) * r);

                // --- SCATTER MODE (HEART) ---
                const tHeart = this.heartParamT;
                const heartScale = 0.7; 
                let x2D = 16 * Math.pow(Math.sin(tHeart), 3);
                let y2D = (13 * Math.cos(tHeart) - 5 * Math.cos(2 * tHeart) - 2 * Math.cos(3 * tHeart) - Math.cos(4 * tHeart));
                let zDepth = (Math.random() - 0.5) * 3; 
                const noise = (Math.random() - 0.5) * 1.5; 

                this.posScatter.set(
                    x2D * heartScale + noise,
                    y2D * heartScale + 5 + noise,
                    zDepth + noise
                );
            }

            update(dt, mode, focusTargetMesh, elapsedTime) {
                let target = this.posTree;
                
                if (mode === 'SCATTER') target = this.posScatter;
                else if (mode === 'FOCUS') {
                    if (this.mesh === focusTargetMesh) {
                        const desiredWorldPos = new THREE.Vector3(0, 2, 35);
                        const invMatrix = new THREE.Matrix4().copy(mainGroup.matrixWorld).invert();
                        target = desiredWorldPos.applyMatrix4(invMatrix);
                    } else {
                        target = this.posScatter;
                    }
                }

                // 移动平滑插值
                const lerpSpeed = (mode === 'FOCUS' && this.mesh === focusTargetMesh) ? 5.0 : 2.0; 
                this.mesh.position.lerp(target, lerpSpeed * dt);

                // --- 旋转逻辑 ---
                if (mode === 'SCATTER') {
                    this.mesh.rotation.x += this.spinSpeed.x * dt;
                    this.mesh.rotation.y += this.spinSpeed.y * dt;
                } else if (mode === 'TREE') {
                    // 树模式下也保留轻微自转，增加闪光感
                    if (this.type === 'DIAMOND' || this.type === 'GOLD_SPHERE') {
                         this.mesh.rotation.y += 1.0 * dt;
                         this.mesh.rotation.z += 0.5 * dt;
                    } else {
                        this.mesh.rotation.x = THREE.MathUtils.lerp(this.mesh.rotation.x, 0, dt);
                        this.mesh.rotation.z = THREE.MathUtils.lerp(this.mesh.rotation.z, 0, dt);
                        this.mesh.rotation.y += 0.2 * dt; // 整体公转感
                    }
                }
                
                if (mode === 'FOCUS' && this.mesh === focusTargetMesh) {
                    this.mesh.lookAt(camera.position); 
                }

                // --- 缩放 & 闪烁逻辑 (The Twinkle) ---
                let s = this.baseScale;
                
                // 1. 基础模式缩放
                if (mode === 'SCATTER' && this.type === 'PHOTO') s = this.baseScale * 2.5; 
                else if (mode === 'FOCUS') {
                    if (this.mesh === focusTargetMesh) s = 4.5; 
                    else s = this.baseScale * 0.8; 
                }

                // 2. 闪烁叠加 (Sine Wave)
                // 只有装饰物闪烁，树叶不闪
                if (mode === 'TREE' && this.type !== 'BOX' && this.type !== 'PHOTO') {
                    const flash = Math.sin(elapsedTime * this.flashSpeed + this.flashPhase);
                    // 范围从 0.8 到 1.3 倍大小波动，配合高光材质产生闪烁
                    s *= (1.0 + flash * 0.25); 
                }
                
                this.mesh.scale.lerp(new THREE.Vector3(s,s,s), 4*dt);
            }
        }

        // --- CREATION ---
        function createParticles() {
            const sphereGeo = new THREE.SphereGeometry(0.5, 16, 16); 
            const boxGeo = new THREE.BoxGeometry(0.55, 0.55, 0.55); 
            const knotGeo = new THREE.TorusKnotGeometry(0.3, 0.15, 30, 6); 
            const icoGeo = new THREE.IcosahedronGeometry(0.5, 0); // 降低面数，更锐利的反光

            const curve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, -0.5, 0), new THREE.Vector3(0, 0.3, 0),
                new THREE.Vector3(0.1, 0.5, 0), new THREE.Vector3(0.3, 0.4, 0)
            ]);
            const candyGeo = new THREE.TubeGeometry(curve, 16, 0.08, 8, false);

            const goldMat = new THREE.MeshStandardMaterial({
                color: CONFIG.colors.champagneGold,
                metalness: 1.0, roughness: 0.05, // 更光滑
                envMapIntensity: 2.5, 
                emissive: 0x664400,    
                emissiveIntensity: 0.5 
            });

            const greenMat = new THREE.MeshStandardMaterial({
                color: CONFIG.colors.deepGreen,
                metalness: 0.1, roughness: 0.9,
                emissive: 0x001100,
            });

            const redMat = new THREE.MeshPhysicalMaterial({
                color: CONFIG.colors.accentRed,
                metalness: 0.4, roughness: 0.2, clearcoat: 1.0,
                emissive: 0x440000, emissiveIntensity: 0.5
            });

            const diamondMat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff, 
                metalness: 1.0, 
                roughness: 0.0, 
                transmission: 0.2, // 玻璃质感
                thickness: 1.0,
                clearcoat: 1.0, 
                emissive: 0x222222, 
                emissiveIntensity: 1.0, 
                reflectivity: 1.0
            });
            
            const candyMat = new THREE.MeshStandardMaterial({ map: caneTexture, roughness: 0.4 });

            for (let i = 0; i < CONFIG.particles.count; i++) {
                const rand = Math.random();
                let mesh, type;
                
                // 增加树叶比例，使其更茂密
                if (rand < 0.35) { 
                    mesh = new THREE.Mesh(boxGeo, greenMat);
                    type = 'BOX';
                } else if (rand < 0.55) { 
                    mesh = new THREE.Mesh(sphereGeo, goldMat);
                    type = 'GOLD_SPHERE';
                } else if (rand < 0.75) { 
                    mesh = new THREE.Mesh(icoGeo, diamondMat);
                    type = 'DIAMOND';
                } else if (rand < 0.90) { 
                    mesh = new THREE.Mesh(boxGeo, goldMat);
                    type = 'GOLD_BOX';
                } else if (rand < 0.95) { 
                    mesh = new THREE.Mesh(knotGeo, redMat);
                    type = 'KNOT';
                } else if (rand < 0.98) { 
                    mesh = new THREE.Mesh(sphereGeo, redMat);
                    type = 'RED';
                } else { 
                    mesh = new THREE.Mesh(candyGeo, candyMat);
                    type = 'CANE';
                }

                const s = 0.2 + Math.random() * 0.3;
                mesh.scale.set(s,s,s);
                mesh.rotation.set(Math.random()*6, Math.random()*6, Math.random()*6);
                
                mainGroup.add(mesh);
                particleSystem.push(new Particle(mesh, type)); 
            }

            // 顶部星星
            const starGeo = new THREE.OctahedronGeometry(1.2, 0);
            const starMat = new THREE.MeshStandardMaterial({
                color: 0xffdd88, emissive: 0xffaa00, emissiveIntensity: 2.0,
                metalness: 1.0, roughness: 0
            });
            starMesh = new THREE.Mesh(starGeo, starMat);
            starMesh.position.set(0, CONFIG.particles.treeHeight/2 + 1.2, 0);
            mainGroup.add(starMesh);
            
            mainGroup.add(photoMeshGroup);
        }

        // --- DUST SYSTEM ---
        function createDust() {
            const count = CONFIG.particles.dustCount;
            const positions = new Float32Array(count * 3);
            const initialPositions = [];
            const geometry = new THREE.BufferGeometry();

            for (let i = 0; i < count; i++) {
                const rScatter = 12 + Math.random() * 20; 
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                const x = rScatter * Math.sin(phi) * Math.cos(theta);
                const y = rScatter * Math.sin(phi) * Math.sin(theta);
                const z = rScatter * Math.cos(phi);

                positions[i * 3 + 0] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
                initialPositions.push(x, y, z); 
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                color: 0xffeebb,
                size: 0.15, // 稍微加大
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending, 
                sizeAttenuation: true 
            });

            dustParticles = new THREE.Points(geometry, material);
            dustParticles.userData.initialPositions = initialPositions;
            mainGroup.add(dustParticles);
        }
        
        function updateDust(dt) {
            if (!dustParticles) return;
            // 在 TREE 模式下也显示一点尘埃，增加气氛
            let opacityTarget = (STATE.mode === 'TREE') ? 0.3 : 0.8;
            dustParticles.material.opacity = THREE.MathUtils.lerp(dustParticles.material.opacity, opacityTarget, 3 * dt);

            const positions = dustParticles.geometry.attributes.position.array;
            const time = clock.elapsedTime * 0.15; 

            for (let i = 0; i < positions.length / 3; i++) {
                // 缓慢漂浮
                positions[i * 3 + 1] = dustParticles.userData.initialPositions[i * 3 + 1] + Math.sin(time + i) * 1.5;
            }
            dustParticles.geometry.attributes.position.needsUpdate = true;
        }

        function createDefaultPhotos() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#050505'; ctx.fillRect(0,0,512,512);
            ctx.strokeStyle = '#eebb66'; ctx.lineWidth = 15; ctx.strokeRect(20,20,472,472);
            ctx.font = '500 60px Times New Roman'; ctx.fillStyle = '#eebb66';
            ctx.textAlign = 'center';
            ctx.fillText("圣诞🎄", 256, 230);
            ctx.fillText("快乐❤️", 256, 300);
            
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            addPhotoToScene(tex);
        }

        // 优化：带精致相框的照片创建
        function addPhotoToScene(texture) {
            const frameConfig = CONFIG.photo.frame;
            
            // 1. 外框（最外层，带渐变光泽）
            const outerFrameGeo = new THREE.BoxGeometry(
                1.4 + frameConfig.outerBorder * 2,  // 宽度 = 原宽度 + 2*外边框
                1.4 + frameConfig.outerBorder * 2,  // 高度 = 原高度 + 2*外边框
                frameConfig.thickness + 0.02        // 厚度 = 相框厚度 + 轻微凸起
            );
            const outerFrameMat = new THREE.MeshStandardMaterial({
                map: frameGradientTexture,
                metalness: 0.9,    // 高金属感
                roughness: 0.15,   // 低粗糙度（有光泽）
                envMapIntensity: 3.0, // 增强环境反射
                emissive: 0x221a00,   // 轻微金色发光
                emissiveIntensity: 0.3
            });
            const outerFrame = new THREE.Mesh(outerFrameGeo, outerFrameMat);
            outerFrame.position.z = -0.01; // 稍微靠后，形成层次感

            // 2. 主相框（中间层，深金色）
            const frameGeo = new THREE.BoxGeometry(1.4, 1.4, frameConfig.thickness);
            const frameMat = new THREE.MeshStandardMaterial({
                color: CONFIG.colors.frameGoldDark,
                metalness: 0.8,
                roughness: 0.2,
                envMapIntensity: 2.5
            });
            const frame = new THREE.Mesh(frameGeo, frameMat);

            // 3. 内边框（最内层，浅金色，突出照片）
            const innerFrameGeo = new THREE.BoxGeometry(
                1.2 + frameConfig.innerBorder * 2,  // 宽度 = 照片宽度 + 2*内边框
                1.2 + frameConfig.innerBorder * 2,  // 高度 = 照片高度 + 2*内边框
                frameConfig.thickness - 0.03        // 厚度 = 相框厚度 - 凹陷
            );
            const innerFrameMat = new THREE.MeshStandardMaterial({
                color: CONFIG.colors.frameGoldLight,
                metalness: 0.9,
                roughness: 0.1,
                envMapIntensity: 3.0,
                emissive: 0x443300,
                emissiveIntensity: 0.2
            });
            const innerFrame = new THREE.Mesh(innerFrameGeo, innerFrameMat);
            innerFrame.position.z = 0.02; // 稍微靠前

            // 4. 照片（最内层）
            const photoGeo = new THREE.PlaneGeometry(1.2, 1.2);
            const brightness = CONFIG.photo.brightness;
            const photoMat = new THREE.MeshBasicMaterial({ 
                map: texture,
                color: new THREE.Color(brightness, brightness, brightness),
                transparent: true,
                opacity: CONFIG.photo.opacity
            });
            const photo = new THREE.Mesh(photoGeo, photoMat);
            photo.position.z = frameConfig.thickness / 2 + 0.01; // 照片在相框内侧，稍微突出

            // 组合所有元素
            const group = new THREE.Group();
            group.add(outerFrame);   // 最外层
            group.add(frame);        // 中间层
            group.add(innerFrame);   // 内层边框
            group.add(photo);        // 照片最前面
            
            const s = 0.5;
            group.scale.set(s, s, s);
            
            photoMeshGroup.add(group);
            particleSystem.push(new Particle(group, 'PHOTO')); 
        }
        
        function handleImageUpload(e) {
            const files = e.target.files;
            if(!files.length) return;
            Array.from(files).forEach(f => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    new THREE.TextureLoader().load(ev.target.result, (t) => {
                        t.colorSpace = THREE.SRGBColorSpace;
                        addPhotoToScene(t);
                    });
                }
                reader.readAsDataURL(f);
            });
        }

        // 亮度控制初始化
        function initBrightnessControl() {
            brightnessSlider = document.getElementById('brightness-slider');
            if (!brightnessSlider) return;

            // 设置初始值（和CONFIG中的默认值一致）
            brightnessSlider.value = CONFIG.photo.brightness;

            // 监听滑块变化事件
            brightnessSlider.addEventListener('input', (e) => {
                const newBrightness = parseFloat(e.target.value);
                CONFIG.photo.brightness = newBrightness;
                
                // 更新所有已创建的照片亮度
                updateAllPhotoBrightness();
            });
        }

        // 更新所有照片的亮度
        function updateAllPhotoBrightness() {
            const brightness = CONFIG.photo.brightness;
            
            // 遍历所有粒子，找到照片类型并更新材质
            particleSystem.forEach(particle => {
                if (particle.type === 'PHOTO') {
                    // 找到照片网格（group中的第四个子元素是photo）
                    const photoMesh = particle.mesh.children[3];
                    if (photoMesh && photoMesh.material) {
                        photoMesh.material.color.setRGB(brightness, brightness, brightness);
                    }
                }
            });
        }

        // --- MEDIAPIPE ---
        async function initMediaPipe() {
            video = document.getElementById('webcam');
            webcamCanvas = document.getElementById('webcam-preview');
            webcamCtx = webcamCanvas.getContext('2d');
            webcamCanvas.width = 160; webcamCanvas.height = 120;

            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 1
            });
            
            if (navigator.mediaDevices?.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.addEventListener("loadeddata", predictWebcam);
            }
        }

        let lastVideoTime = -1;
        async function predictWebcam() {
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                if (handLandmarker) {
                    const result = handLandmarker.detectForVideo(video, performance.now());
                    processGestures(result);
                }
            }
            requestAnimationFrame(predictWebcam);
        }

        function processGestures(result) {
            if (result.landmarks && result.landmarks.length > 0) {
                STATE.hand.detected = true;
                const lm = result.landmarks[0];
                STATE.hand.x = (lm[9].x - 0.5) * 2; 
                STATE.hand.y = (lm[9].y - 0.5) * 2; 

                const thumb = lm[4]; const index = lm[8]; const wrist = lm[0];
                const pinchDist = Math.hypot(thumb.x - index.x, thumb.y - index.y);
                const tips = [lm[8], lm[12], lm[16], lm[20]];
                let avgDist = 0;
                tips.forEach(t => avgDist += Math.hypot(t.x - wrist.x, t.y - wrist.y));
                avgDist /= 4;

                if (pinchDist < 0.05) {
                    if (STATE.mode !== 'FOCUS') {
                        STATE.mode = 'FOCUS';
                        const photos = particleSystem.filter(p => p.type === 'PHOTO');
                        if (photos.length) {
                            let closestPhoto = null;
                            let minDistance = Infinity;
                            const handScreenPos = new THREE.Vector2(STATE.hand.x, -STATE.hand.y); 
                            
                            photos.forEach(p => {
                                const mesh = p.mesh;
                                const worldPos = mesh.getWorldPosition(new THREE.Vector3());
                                const screenPos = worldPos.clone().project(camera); 
                                const dist = handScreenPos.distanceTo(new THREE.Vector2(screenPos.x, screenPos.y));
                                if (dist < minDistance) {
                                    minDistance = dist;
                                    closestPhoto = mesh;
                                }
                            });
                            STATE.focusTarget = closestPhoto;
                        }
                    }
                } else if (avgDist < 0.25) {
                    STATE.mode = 'TREE';
                    STATE.focusTarget = null;
                } else if (avgDist > 0.4) {
                    STATE.mode = 'SCATTER';
                    STATE.focusTarget = null;
                }
            } else {
                STATE.hand.detected = false;
            }
        }

        function setupEvents() {
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
            });
            document.getElementById('file-input').addEventListener('change', handleImageUpload);
            window.addEventListener('keydown', (e) => {
                if (e.key.toLowerCase() === 'h') {
                    const controls = document.getElementById('controls-bottom-right');
                    if (controls) controls.classList.toggle('ui-hidden');
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            const elapsedTime = clock.elapsedTime;

            // Rotation Logic
            if (STATE.mode === 'SCATTER' && STATE.hand.detected) {
                const targetRotY = STATE.hand.x * Math.PI * 0.9; 
                const targetRotX = STATE.hand.y * Math.PI * 0.25;
                STATE.rotation.y += (targetRotY - STATE.rotation.y) * 3.0 * dt;
                STATE.rotation.x += (targetRotX - STATE.rotation.x) * 3.0 * dt;
            } else {
                if(STATE.mode === 'TREE') {
                    STATE.rotation.y += 0.2 * dt; // 稍微减慢公转速度，让闪烁更明显
                    STATE.rotation.x += (0 - STATE.rotation.x) * 2.0 * dt; 
                } else {
                     STATE.rotation.y += 0.1 * dt; 
                }
            }

            mainGroup.rotation.y = STATE.rotation.y;
            mainGroup.rotation.x = STATE.rotation.x;

            // 星星自转
            if(starMesh) starMesh.rotation.y -= 1.5 * dt;

            particleSystem.forEach(p => p.update(dt, STATE.mode, STATE.focusTarget, elapsedTime));
            updateDust(dt); 
            composer.render();
        }

        init();
    </script>
</body>
